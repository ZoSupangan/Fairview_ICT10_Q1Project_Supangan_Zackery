<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obmc cafe sku</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border-radius: 0 !important;
        }

        body {
            background-color: #230638;
            background-image: url('https://preview.redd.it/transparent-brick-overlay-v0-54h2mjo7lwg51.png?width=640&crop=smart&auto=webp&s=fc4907997877fdab5e26327b5cf272456064a9a6');
            background-repeat: repeat;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            background-color: #120320;
            color: #ffffff;
            padding: 20px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 16px;
        }

        .nav-links a {
            color: #d8b4fe;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ffffff;
            background-color: #3b0764;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 680px;
            border: 4px solid #000000;
            box-shadow: 10px 10px 0px #000000;
        }

        .banner {
            background-color: #3b0764;
            color: #ffffff;
            text-align: center;
            padding: 32px 20px;
            border-bottom: 4px solid #000000;
        }

        .banner h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .banner p {
            font-size: 15px;
            color: #e9d5ff;
        }

        .content {
            padding: 36px;
        }

        .menu-title {
            color: #111827;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-control label {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        .form-control input, .form-control select {
            padding: 12px;
            border: 2px solid #000000;
            font-size: 15px;
            background-color: #ffffff;
        }

        .btn-action {
            width: 100%;
            margin-top: 10px;
            background-color: #7e22ce;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border: 3px solid #000000;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
        }

        .btn-action:hover {
            background-color: #6b21a8;
        }

        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        #sku-output {
            margin-top: 28px;
            background-color: #f8fafc;
            border: 2px dashed #000000;
            padding: 24px;
        }

        .placeholder-text {
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .sku-box {
            background-color: #3b0764;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            border: 2px solid #000000;
        }

        .sku-code {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #facc15;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Obmc cafe</div>
        <div class="nav-links">
            <a href="index.html">Receipt Generator</a>
            <a href="sku.html" class="active">SKU Generator</a>
        </div>
    </header>

    <main>
        <div class="card">
            
            <div class="banner">
                <h1>OBMC cafe</h1>
                <p>Coffee Shop</p>
            </div>

            <div class="content">
                <div class="menu-title">Generate Item SKU</div>

                <form class="form-group" onsubmit="return false;">
                    <div class="form-control">
                        <label for="sku-name">Product Name</label>
                        <input type="text" id="sku-name" placeholder="e.g. Spanish Latte">
                    </div>

                    <div class="form-control">
                        <label for="sku-category">Category</label>
                        <select id="sku-category">
                            <option value="ESP">Espresso / Mocha</option>
                            <option value="COLD">Cold Brew / Iced</option>
                            <option value="SPE">Specialty / Dessert</option>
                        </select>
                    </div>

                    <div class="form-control">
                        <label for="sku-size">Size</label>
                        <select id="sku-size">
                            <option value="REG">Regular (12oz)</option>
                            <option value="LRG">Large (20oz)</option>
                        </select>
                    </div>

                    <button type="button" id="btn-sku" class="btn-action">
                        Generate SKU
                    </button>
                </form>

                <div id="sku-output">
                    <p class="placeholder-text">Generated SKU code will appear here.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="py" src="main.py"></script>
</body>
</html>
